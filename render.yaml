services:
  - type: web
    name: yardly-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --error-logfile -
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Yardly <noreply@shecodes.site>
      - key: FRONTEND_URL
        value: https://yardly-alpha.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://yardly-alpha.vercel.app,https://yardly-tau.vercel.app
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_TO_FILE
        value: "False"
